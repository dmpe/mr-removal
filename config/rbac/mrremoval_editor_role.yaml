# This rule is not used by the project gitlab-remove-mr-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the gitlab.dmpe.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: gitlab-remove-mr-operator
    app.kubernetes.io/managed-by: kustomize
  name: mrremoval-editor-role
rules:
- apiGroups:
  - gitlab.dmpe.github.io
  resources:
  - mrremovals
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gitlab.dmpe.github.io
  resources:
  - mrremovals/status
  verbs:
  - get
