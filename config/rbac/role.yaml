---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - gitlab.dmpe.github.io
  resources:
  - mrremovals
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gitlab.dmpe.github.io
  resources:
  - mrremovals/finalizers
  verbs:
  - update
- apiGroups:
  - gitlab.dmpe.github.io
  resources:
  - mrremovals/status
  verbs:
  - get
  - patch
  - update
